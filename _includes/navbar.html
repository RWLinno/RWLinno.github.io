<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">
            {{ site.data.profile.navbar_name }}
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ml-auto">
                {% for nav_page in site.data.navigation.pages %}
                {% assign nav_url_with_slash = nav_page.url | append: '/' %}
                <li class="nav-item">
                    <a class="nav-link{% if page.url == nav_page.url or page.url == nav_url_with_slash %} active{% endif %}" href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url or page.url == nav_url_with_slash %} aria-current="page"{% endif %}>
                        <span data-i18n="{{ nav_page.i18n_key }}">{{ nav_page.name }}</span>
                    </a>
                </li>
                {% endfor %}
            </ul>
            <div class="language-switch ml-lg-3 mt-3 mt-lg-0" role="group" aria-label="Language / 语言">
                <button type="button" data-language="en" aria-pressed="true">EN</button>
                <span aria-hidden="true">/</span>
                <button type="button" data-language="zh" aria-pressed="false">中文</button>
            </div>
        </div>
    </div>
</nav>
