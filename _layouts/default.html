<!DOCTYPE html>
<html lang="en">
<!-- Template adapted from: https://github.com/luost26/academic-homepage -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#f3f7fa">
    <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>
    <link rel="icon" href="{{ '/fav.ico' | relative_url }}">
    <script>
        try {
            if (localStorage.getItem('rwlinno-language') === 'zh') {
                document.documentElement.lang = 'zh-CN';
            }
        } catch (error) {
            // The site remains in English when storage is unavailable.
        }
    </script>

    <!-- Stylesheets -->
    <link rel="preload" href="{{ '/assets/vendor/fontawesome/webfonts/fa-solid-900.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/vendor/fontawesome/webfonts/fa-brands-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/vendor/bootstrap/bootstrap.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/vendor/fontawesome/css/all.min.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Noto+Sans+SC:wght@400;500;700&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body class="bg-light" data-i18n-title="{{ page.i18n_title }}" {{ page.body_attr }}>
    <a class="skip-link" href="#main-content" data-i18n="accessibility.skip_to_content">Skip to main content</a>
    {% include navbar.html %}
    <main id="main-content" class="container" tabindex="-1">
        {{content}}
    </main>
    {% include footer.html %}

    <script id="site-translations" type="application/json">{{ site.data.i18n | jsonify }}</script>
    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
</body>
</html>
