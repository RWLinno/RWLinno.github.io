<script>
const trips=JSON.parse(document.getElementById('travel-data').textContent),$=id=>document.getElementById(id);
const ui={zh:{title:'全球旅游计划',tagline:'把去过的地方与下一段旅程，收进同一本路书。按旅游目的、行程安排与攻略参考，留下可复用的路线。',purpose:'旅游目的',schedule:'行程安排',modules:'攻略参考',checks:'出行提示',visited:'已去过',planned:'计划中',all:'全部',sources:'官方攻略入口',print:'打印当前语言',download:'下载双语行程 .md',public:'旅行路线与攻略参考。再次出发前，请核对景点开放时间、交通与天气。',footer:'更新于 2026.10.14 · 旅行回顾与未来计划',home:'返回个人主页 ↗',heads:['当地日期','城市／路线','活动安排','类型／状态'],selected:'正在查看',view:'查看行程 →',downloaded:'已生成双语 Markdown 行程。',stay:'住宿／状态'},en:{title:'Global travel plans',tagline:'Places visited and journeys ahead, in one small atlas. Travel purpose, itineraries and practical references for routes worth reusing.',purpose:'Travel purpose',schedule:'Itinerary',modules:'Travel references',checks:'Practical notes',visited:'Visited',planned:'Planned',all:'All',sources:'Official travel references',print:'Print this language',download:'Download bilingual .md',public:'Routes and practical travel references. Check attraction hours, transport and weather before setting out again.',footer:'Updated 14 OCT 2026 · Travel journals & future plans',home:'Back to homepage ↗',heads:['Local date','City / route','Activities','Type / status'],selected:'Currently viewing',view:'View itinerary →',downloaded:'Bilingual Markdown itinerary generated.',stay:'Stay / status'}};
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh',selected=trips.find(t=>t.id===location.hash.slice(1))||trips[0];
let category='all';
const value=x=>typeof x==='string'?x:x[lang];
function text(tag,content){const e=document.createElement(tag);e.textContent=content;return e;}
function list(id,items){$(id).replaceChildren(...items.map(x=>text('li',value(x))));}
function render(){const u=ui[lang],t=selected;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=`${u.title} · ${t.code}`;
for(const[id,key]of Object.entries({pageTitle:'title',tagline:'tagline',purposeTitle:'purpose',scheduleTitle:'schedule',modulesTitle:'modules',checksTitle:'checks',sourceTitle:'sources',print:'print',download:'download',publicNote:'public',footerNote:'footer',homeLink:'home'}))$(id).textContent=u[key];
document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
$('itinerary').dataset.kind=t.kind;
$('filters').replaceChildren(...['visited','planned','all'].map(kind=>{const b=text('button',u[kind]+' · '+trips.filter(x=>kind==='all'||x.kind===kind).length);b.setAttribute('aria-pressed',category===kind);b.addEventListener('click',()=>{category=kind;if(kind!=='all'&&selected.kind!==kind)selected=trips.find(x=>x.kind===kind);updateURL();render();});return b;}));
$('trips').replaceChildren(...trips.filter(x=>category==='all'||x.kind===category).map(trip=>{const b=document.createElement('button');b.className='trip-choice';b.dataset.kind=trip.kind;b.setAttribute('aria-pressed',trip.id===t.id);b.setAttribute('aria-controls','itinerary');b.append(text('strong',trip.code));const copy=text('span',value(trip.region));copy.append(text('small',value(trip.dates)),text('i',trip.id===t.id?u.selected:u.view));b.append(copy);b.addEventListener('click',()=>{selected=trip;updateURL();render();});return b;}));
$('region').textContent=value(t.region)+' / '+value(t.dates);$('tripTitle').textContent=value(t.title);$('status').textContent=value(t.status);$('intro').textContent=value(t.intro);$('routeNote').textContent=value(t.routeNote);
$('facts').replaceChildren(...t.facts.map(([a,b])=>{const el=document.createElement('div');el.className='fact';el.append(text('small',value(a)),text('strong',value(b)));return el;}));
const head=document.createElement('tr');u.heads.forEach(h=>{const e=text('th',h);e.scope='col';head.append(e);});$('thead').replaceChildren(head);
$('days').replaceChildren(...t.days.map(day=>{const row=document.createElement('tr');[day.date,value(day.city),value(day.activity),value(day.stay)].forEach(v=>row.append(text('td',v)));return row;}));list('modules',t.modules);list('checks',t.checks);
$('sources').replaceChildren(...t.sources.map(([label,url])=>{const a=text('a',label+' ↗');a.href=url;a.rel='noreferrer';return a;}));$('notice').textContent='';drawRoute(t.route);renderPhotos(t);}

function renderPhotos(trip){const photos=trip.photos||[];$('gallery').hidden=photos.length===0;$('gallery').replaceChildren(...photos.map(photo=>{const figure=document.createElement('figure'),link=document.createElement('a'),img=document.createElement('img');link.href=photo.src;link.target='_blank';link.rel='noopener';link.setAttribute('aria-label',value(photo.caption)+(lang==='zh'?' · 打开照片':' · Open photo'));img.src=photo.src;img.alt=value(photo.caption);img.width=photo.width;img.height=photo.height;img.loading='lazy';img.decoding='async';link.append(img);figure.append(link,text('figcaption',value(photo.caption)));return figure;}));}
function drawRoute(points){$('mobileRoute').replaceChildren(...points.map((p,i)=>text('span',(i?'→ ':'')+p)));const ns='http://www.w3.org/2000/svg',plot=$('route');plot.replaceChildren();const make=(tag,attrs,content='')=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);e.textContent=content;return e;};plot.append(make('line',{x1:90,y1:52,x2:810,y2:52,stroke:'#adc5d2','stroke-width':2}));points.forEach((p,i)=>{const x=90+i*720/(points.length-1);plot.append(make('circle',{cx:x,cy:52,r:7,fill:i===2?'#28755b':'#256b89',stroke:'white','stroke-width':3}),make('text',{x,y:88,'text-anchor':'middle',fill:'#173c50','font-size':13,'font-family':'monospace'},p));});}
function updateURL(){history.replaceState(null,'',`?lang=${lang}#${selected.id}`);}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;updateURL();render();}));window.addEventListener('hashchange',()=>{selected=trips.find(t=>t.id===location.hash.slice(1))||trips[0];category='all';render();});
$('print').addEventListener('click',()=>window.print());
function bilingual(x){return x.zh+' / '+x.en;}
function markdown(t){let lines=[`# ${bilingual(t.title)}`,bilingual(t.dates),'',bilingual(t.status),'','## 旅游目的 / Travel purpose','',bilingual(t.intro),'',...t.facts.map(([label,val])=>'- '+bilingual(label)+': '+bilingual(val)),'',`Route: ${t.route.join(' → ')}`,'',bilingual(t.routeNote),'','## 行程安排 / Itinerary',''];for(const d of t.days)lines.push(`### ${d.date} · ${bilingual(d.city)}`,d.activity.zh,d.activity.en,`类型／状态 / Type / status: ${bilingual(d.stay)}`,'');for(const [title,items]of[['攻略参考 / Travel references',t.modules],['出行提示 / Practical notes',t.checks]])lines.push('## '+title,...items.map(x=>'- '+bilingual(x)),'');lines.push('## 官方攻略入口 / Official travel references',...t.sources.map(([name,url])=>`- [${name}](${url})`),'',ui.zh.public,ui.en.public);if(t.photos?.length)lines.push('','## 旅途风景 / Travel photographs','',...t.photos.map(p=>`![${bilingual(p.caption)}](https://rwlinno.github.io/travel/${p.src})`));return lines.join('\n');}
$('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([markdown(selected)],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=selected.id+'-bilingual.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('notice').textContent=ui[lang].downloaded;});render();
</script></body></html>
