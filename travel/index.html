<script>
const trips=JSON.parse(document.getElementById('travel-data').textContent),$=id=>document.getElementById(id);
const ui={zh:{title:'全球旅游计划',tagline:'把散落的行程收进同一本路书。保留路线、每天的重点与出发前要确认的事。',schedule:'每日行程',modules:'可选模块',checks:'出发前确认',sources:'官方信息与版本说明',print:'打印当前语言',download:'下载双语行程 .md',public:'公开的精简行程；不是预订凭证。隐藏入口不提供访问保护，证件与订单请另行保存。',footer:'整理日期 2026.10.14 · 两种语言共用一份行程数据',home:'返回个人主页 ↗',heads:['当地日期','城市／路线','当天重点','住宿／状态'],selected:'正在查看',view:'查看行程 →',downloaded:'已生成双语 Markdown 行程。',stay:'住宿／状态'},en:{title:'Global travel plans',tagline:'A small atlas for the journeys ahead. Routes, daily priorities and the decisions that still need a check.',schedule:'Day by day',modules:'Optional modules',checks:'Before departure',sources:'Official information & version notes',print:'Print this language',download:'Download bilingual .md',public:'A public planning summary, not a booking confirmation. A hidden entry does not restrict access; keep identity and booking documents separately.',footer:'Consolidated 14 OCT 2026 · One itinerary source, two languages',home:'Back to homepage ↗',heads:['Local date','City / route','Daily focus','Stay / status'],selected:'Currently viewing',view:'View itinerary →',downloaded:'Bilingual Markdown itinerary generated.',stay:'Stay / status'}};
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh',selected=trips.find(t=>t.id===location.hash.slice(1))||trips[0];
const value=x=>typeof x==='string'?x:x[lang];
function text(tag,content){const e=document.createElement(tag);e.textContent=content;return e;}
function list(id,items){$(id).replaceChildren(...items.map(x=>text('li',value(x))));}
function render(){const u=ui[lang],t=selected;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=`${u.title} · ${t.code}`;
for(const[id,key]of Object.entries({pageTitle:'title',tagline:'tagline',scheduleTitle:'schedule',modulesTitle:'modules',checksTitle:'checks',sourceTitle:'sources',print:'print',download:'download',publicNote:'public',footerNote:'footer',homeLink:'home'}))$(id).textContent=u[key];
document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
$('trips').replaceChildren(...trips.map(trip=>{const b=document.createElement('button');b.className='trip-choice';b.setAttribute('aria-pressed',trip.id===t.id);b.setAttribute('aria-controls','itinerary');b.append(text('strong',trip.code));const copy=text('span',value(trip.region));copy.append(text('small',value(trip.dates)),text('i',trip.id===t.id?u.selected:u.view));b.append(copy);b.addEventListener('click',()=>{selected=trip;updateURL();render();});return b;}));
$('region').textContent=value(t.region)+' / '+value(t.dates);$('tripTitle').textContent=value(t.title);$('status').textContent=value(t.status);$('intro').textContent=value(t.intro);$('routeNote').textContent=value(t.routeNote);$('provenance').textContent=value(t.provenance);
$('facts').replaceChildren(...t.facts.map(([a,b])=>{const el=document.createElement('div');el.className='fact';el.append(text('small',value(a)),text('strong',value(b)));return el;}));
const head=document.createElement('tr');u.heads.forEach(h=>{const e=text('th',h);e.scope='col';head.append(e);});$('thead').replaceChildren(head);
$('days').replaceChildren(...t.days.map(day=>{const row=document.createElement('tr');[day.date,value(day.city),value(day.activity),value(day.stay)].forEach(v=>row.append(text('td',v)));return row;}));list('modules',t.modules);list('checks',t.checks);
$('sources').replaceChildren(...t.sources.map(([label,url])=>{const a=text('a',label+' ↗');a.href=url;a.rel='noreferrer';return a;}));$('notice').textContent='';drawRoute(t.route);}
function drawRoute(points){$('mobileRoute').replaceChildren(...points.map((p,i)=>text('span',(i?'→ ':'')+p)));const ns='http://www.w3.org/2000/svg',plot=$('route');plot.replaceChildren();const make=(tag,attrs,content='')=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);e.textContent=content;return e;};plot.append(make('line',{x1:90,y1:52,x2:810,y2:52,stroke:'#adc5d2','stroke-width':2}));points.forEach((p,i)=>{const x=90+i*720/(points.length-1);plot.append(make('circle',{cx:x,cy:52,r:7,fill:i===2?'#28755b':'#256b89',stroke:'white','stroke-width':3}),make('text',{x,y:88,'text-anchor':'middle',fill:'#173c50','font-size':13,'font-family':'monospace'},p));});}
function updateURL(){history.replaceState(null,'',`?lang=${lang}#${selected.id}`);}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;updateURL();render();}));window.addEventListener('hashchange',()=>{selected=trips.find(t=>t.id===location.hash.slice(1))||trips[0];render();});
$('print').addEventListener('click',()=>window.print());
function bilingual(x){return x.zh+' / '+x.en;}
function markdown(t){let lines=[`# ${bilingual(t.title)}`,bilingual(t.dates),'',bilingual(t.status),'',bilingual(t.intro),'',...t.facts.map(([label,val])=>'- '+bilingual(label)+': '+bilingual(val)),'',`Route: ${t.route.join(' → ')}`,'',bilingual(t.routeNote),'','## 每日行程 / Day by day',''];for(const d of t.days)lines.push(`### ${d.date} · ${bilingual(d.city)}`,d.activity.zh,d.activity.en,`住宿 / Stay: ${bilingual(d.stay)}`,'');for(const [title,items]of[['可选模块 / Optional modules',t.modules],['出发前确认 / Before departure',t.checks]])lines.push('## '+title,...items.map(x=>'- '+bilingual(x)),'');lines.push('## 来源与版本 / Sources & version',...t.sources.map(([name,url])=>`- [${name}](${url})`),'',bilingual(t.provenance),'',ui.zh.public,ui.en.public);return lines.join('\n');}
$('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([markdown(selected)],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=selected.id+'-bilingual.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('notice').textContent=ui[lang].downloaded;});render();
</script></body></html>
