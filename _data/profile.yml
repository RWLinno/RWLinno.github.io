short_bio: >-
  <p style="margin-bottom: 5px;">
  I am an incoming PhD student in <a href="https://www.cse.cuhk.edu.hk/" target="_blank">Computer Science and Engineering</a> at <a href="https://www.cuhk.edu.hk/" target="_blank">The Chinese University of Hong Kong (CUHK)</a>, supervised by <a href="https://www.cse.cuhk.edu.hk/~jcheng/" target="_blank">Prof. James Cheng</a>, jointly trained with <a href="https://knowin.ai" target="_blank">Knowin AI Inc. (Shenzhen)</a>. I received my MPhil from <a href="https://www.hkust-gz.edu.cn/" target="_blank">HKUST(GZ)</a> supervised by <a href="https://yuxuanliang.com/" target="_blank">Prof. Yuxuan Liang</a>.
  </p>
  <p style="margin-bottom: 5px;">
  My research interests include Spatio-Temporal World/Action Models, Embodied Foundation Models, Data Generation & Verification, and Infrastructure (Infra) for AI systems. And my research experiences include Spatio-Temporal Data Mining, Time Series Forecasting, and Multi-Modal Learning.
  </p>

